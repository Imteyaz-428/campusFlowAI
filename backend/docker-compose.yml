name: campusflow

services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: campusflow_db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campusflow

    ports:
      - "5434:5432"

    volumes:
      - campusflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: campusflow_redis

    restart: always

    ports:
      - "6380:6379"

    volumes:
      - campusflow_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .

    container_name: campusflow_backend

    restart: always

    ports:
      - "8001:8000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - .:/app

    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port 8000
      --reload

volumes:
  campusflow_postgres_data:
  campusflow_redis_data:
